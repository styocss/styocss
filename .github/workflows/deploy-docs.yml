name: Deploy docs to pikacss.github.io

# Deliberately not triggered by pushes to `main`. The playground's template
# manifests are rewritten at build time to the *published* `@pikacss/*`
# versions, so a deploy that runs before a release resolves to the previous
# release anyway — and two deploys per release only contended for the
# concurrency group below. Docs changes reach the site with the next release,
# or immediately via `workflow_dispatch`.
on:
  workflow_dispatch:

  # Called by the Release workflow so the docs/playground redeploy with the
  # just-published package versions once publishing has finished.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # Only the optional snapshot step below needs a browser, so this one is
      # optional too. `--with-deps` runs `apt-get update` on the runner, and
      # that is the one part of this job nothing here controls: on 2026-08-18 a
      # wedged `azure.archive.ubuntu.com` mirror held a normally-43-second step
      # for over half an hour, with no timeout to stop it. Cap it and let the
      # deploy carry on without a browser.
      - name: install playwright chromium
        id: playwright
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm --filter @pikacss/playground exec playwright install --with-deps chromium

      - name: build
        run: pnpm build && pnpm docs:build && pnpm playground:build

      # Pre-generate the playground dependency snapshots (fast first visit).
      # Non-fatal in both directions: skipped when the browser is missing, and
      # tolerant of its own failures. Without a snapshot the playground falls
      # back to the ~90s in-container npm install on first visit.
      - name: generate playground snapshots
        if: steps.playwright.outcome == 'success'
        run: pnpm --filter @pikacss/playground gen-snapshots || echo '::warning::snapshot generation failed; playground will npm install on demand'

      - name: report skipped snapshots
        if: steps.playwright.outcome != 'success'
        run: echo '::warning::playwright install failed or timed out; snapshots skipped, playground will npm install on demand'

      - name: push dist to pikacss.github.io
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          TARGET_REPO: https://x-access-token:${{ secrets.DOCS_DEPLOY_TOKEN }}@github.com/pikacss/pikacss.github.io.git
        run: |
          set -eu

          dist_dir="docs/.vitepress/dist"
          rm -rf "$dist_dir/.git"
          touch "$dist_dir/.nojekyll"

          # Serve the playground under /playground/ next to the docs.
          rm -rf "$dist_dir/playground"
          cp -R playground/dist "$dist_dir/playground"

          cd "$dist_dir"
          git init --initial-branch=main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Deploy docs from ${GITHUB_SHA}"

          git remote add origin "$TARGET_REPO"
          git push --force origin HEAD:main
