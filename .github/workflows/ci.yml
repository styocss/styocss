name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull-request gates diff against the merge base, so the shallow
          # default clone is not enough.
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # Rules from AGENTS.md that a contributor who never read AGENTS.md would
      # otherwise break. No-ops on pushes to main, where HEAD is the merge base.
      - name: pull-request gates (generated files, regression tests)
        run: pnpm ci:pr-gates
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - name: release validation tests
        run: pnpm test:release-validation

      - name: build
        run: pnpm build

      - name: test playground workbench
        run: pnpm --filter @pikacss/playground test

      - name: build playground
        run: pnpm --filter @pikacss/playground build

      - name: typecheck playground
        run: pnpm --filter @pikacss/playground type-check

      - name: bound playwright apt network waits
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "3";
          DPkg::Lock::Timeout "120";
          EOF

      - name: install playwright chromium
        timeout-minutes: 7
        run: pnpm --filter @pikacss/playground exec playwright install --with-deps chromium

      - name: smoke playground filesystem and typegen sync
        run: pnpm --filter @pikacss/playground smoke:sync

      # `build` only writes gitignored dist/, so a bare `git diff` can never see
      # drift of committed generated artifacts. Re-run the real generators for the
      # tracked outputs (packages/core/src/generated/*.ts + docs/api/*.md) and fail
      # if the working tree changed. Both generators are idempotent on a clean tree.
      - name: check for uncommitted codegen drift (css-data + api docs)
        id: codegen-drift
        run: |
          pnpm generate:core:css
          pnpm maintain-docs:gen-api
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed generated outputs are out of date. Run 'pnpm generate:core:css' and 'pnpm maintain-docs:gen-api', then commit the result."
            git status --porcelain
            exit 1
          fi

      - name: upload regenerated outputs for codegen drift diagnosis
        if: failure() && steps.codegen-drift.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-drift-${{ github.sha }}
          path: |
            docs/api/*.md
            packages/core/src/generated/*.ts
          if-no-files-found: error
          retention-days: 1

      # Canonical non-mutating docs gate: structure/frontmatter, generated API
      # freshness, implementation contracts, JSDoc integrity, checked examples,
      # docs typecheck, zh-TW lint, and the VitePress dead-link build.
      - name: check documentation
        run: pnpm docs:check

      - name: check publish correctness (publint + are-the-types-wrong)
        run: pnpm publint && pnpm attw

      - name: strict packed consumer topology
        run: pnpm test:strict-consumers

      - name: real vite build e2e
        run: pnpm test:e2e

      - name: lint files
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: type/editor performance acceptance
        if: github.event_name == 'pull_request'
        run: pnpm type-bench:acceptance
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}

      # Non-blocking visibility: source-to-doc impact and translation freshness
      # are review signals, not defects by themselves.
      - name: documentation status (impact + zh-tw freshness)
        run: pnpm docs:status
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: ['22.19.0', 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      # Repository tooling requires Node.js 24, while published packages retain
      # their Node.js >=22.19.0 runtime contract. Install and build with the tooling
      # baseline, then execute the package test suite on each supported runtime.
      - name: setup repository tooling node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: setup package runtime node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: test
        run: pnpm test
