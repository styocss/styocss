name: Release

# The whole publish flow. `pnpm release` (see RELEASING.md) bumps every
# manifest in lockstep, pushes the version commit to `main`, then pushes the
# `v*` tag that starts this workflow.
#
# Do not rename this file. npm trusted publishing authorizes a specific
# repository *and workflow filename*; publishing from any other file fails the
# OIDC exchange, and nothing local will warn you.
#
# There is deliberately no `environment:` here. The trusted publisher is not
# scoped to one, and `pnpm release` already asks the owner to confirm before it
# pushes the tag.
#
# The tag has to be pushed by a person. A tag pushed with `GITHUB_TOKEN` does
# not start a workflow run, so an automated tag would silently publish nothing.

permissions:
  contents: write # changelogithub creates the GitHub release
  id-token: write # npm trusted publishing (OIDC)

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # A tag on an old main commit would publish something that was no longer
      # the reviewed tip. Require the exact current main tip, not merely an
      # ancestor of it. This is repeated immediately before publish below to
      # narrow the validation window in which main could advance during
      # validation.
      - name: verify the release commit
        run: |
          git fetch --quiet origin main
          tag_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Tag $GITHUB_REF_NAME points to $tag_sha, but origin/main is $main_sha. Release tags must point to the reviewed main tip."
            exit 1
          fi

          echo "$GITHUB_REF_NAME points to the current origin/main tip."

      - name: verify tag and workspace versions
        run: node scripts/release-validation.mjs "$GITHUB_REF_NAME"

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # Both generators write tracked repository sources. They must run before
      # build so the dist/ being published is derived from the committed tree.
      # API docs are included because they are committed generated output whose
      # drift should also invalidate a release, even though docs are not npm
      # artifacts.
      - name: verify committed generated sources before build
        run: |
          pnpm generate:core:css
          pnpm maintain-docs:gen-api
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed generated outputs are out of date. Run 'pnpm generate:core:css' and 'pnpm maintain-docs:gen-api', then commit the result."
            git status --short
            exit 1
          fi

      - name: build
        run: pnpm build

      # This is the pre-publish gate. There is no pull request in front of a
      # release any more, so nothing else has necessarily checked this exact
      # tree before npm sees it: `ci.yml` runs on the version commit's push to
      # `main` in parallel with this workflow, and its result arrives too late
      # to stop a publish. Keep the gate here, ahead of the publish step.
      - name: verify the tree being published
        run: pnpm typecheck && pnpm test:release && pnpm test:e2e

      - name: check publish correctness (publint + are-the-types-wrong)
        run: pnpm publint && pnpm attw

      - name: re-verify the release commit before publish
        run: |
          git fetch --quiet origin main
          tag_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Refusing to publish: tag $GITHUB_REF_NAME points to $tag_sha, but origin/main is now $main_sha. The release main tip changed during validation."
            exit 1
          fi

          echo "$GITHUB_REF_NAME still points to the current origin/main tip; publishing."

      - name: publish (npm trusted publishing)
        run: pnpm publish:packages

      - name: generate release notes
        # Pinned via the lockfile (devDependency) instead of an unpinned `npx`.
        run: pnpm exec changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # repopack is not chained here: it triggers on `v*` tags itself, and the tag
  # is pushed by a person, so it starts on its own.
  deploy-docs:
    name: Deploy docs
    # The only automatic docs deploy there is: `deploy-docs.yml` has no push
    # trigger, so the site and playground pick up the just-published versions
    # here and nowhere else. Runs after `publish` so npm already has them.
    needs: publish
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
