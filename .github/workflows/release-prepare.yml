name: Release — prepare

# Stage 1 of 2. Bumps versions on a branch and opens the release pull request.
# Nothing is tagged or published here.
#
# Why a pull request instead of pushing to main: branch protection blocks every
# direct push to the default branch, including this workflow's. Rather than
# handing the GitHub Actions app a bypass — which would let *any* workflow in
# this repository write to main — the version commit arrives the same way every
# other change does. Merging that pull request is the human gate; stage 2
# (`release-publish.yml`) reacts to the merge.

permissions:
  contents: write # push the release branch
  pull-requests: write # open and label the release pull request

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Type of version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Serialize against release-publish so two releases cannot interleave.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # No validate step here on purpose: CI runs the full gate on the release
      # branch (ci.yml covers `release/**` pushes precisely so these required
      # checks appear on the pull request) and again on main after the merge.
      # The tree being published is therefore the tree that was checked.
      - name: bump version on a release branch
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --no-tag/--no-push: the tag belongs to the merged commit on main,
          # which only exists after stage 2. bumpp commits locally; the branch
          # is created at that commit and pushed on its own.
          pnpm exec bumpp -r ${{ github.event.inputs.bump_type }} -y --no-tag --no-push

          version="$(node -p "require('./package.json').version")"
          branch="release/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git switch -c "$branch"
          git push origin "$branch"

      - name: open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          # The label is what release-publish.yml keys on, so make sure it
          # exists before the pull request needs it.
          gh label create release \
            --color 0E8A16 \
            --description "Version bump; merging publishes to npm" \
            --force

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --label release \
            --title "chore: release v$VERSION" \
            --body "$(cat <<EOF
          Version bump to \`v$VERSION\` produced by \`release-prepare.yml\`.

          **Merging this pull request publishes to npm.** \`release-publish.yml\`
          reacts to the merge: it tags the merged commit \`v$VERSION\`, publishes
          every package under \`packages/\` with npm trusted publishing, writes the
          GitHub release notes, and redeploys the docs.

          Close it instead if you do not want to release.
          EOF
          )"
