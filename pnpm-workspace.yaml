  simple-git-hooks: ^2.13.1
  tsdown: 0.21.7
  tsx: ^4.22.5
  typescript: ^6.0.3
  unifont: 0.7.4
  unplugin: ^3.3.0
  vite: ^8.2.2
  vite-plugin-vue-devtools: ^8.1.5
  vitepress: 2.0.0-alpha.17
  vitepress-plugin-group-icons: ^1.7.5
  vitepress-plugin-llms: ^1.13.2
