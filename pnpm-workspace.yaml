blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@webref/css'
  - '@mdn/browser-compat-data'
  - '@mdn/data'
  - web-features
  - '@deviltea/eslint-config'
  - '@deviltea/tsconfig'
shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # semver@6.3.1 (latest 6.x, required by @babel/core via `^6.3.1`) predates npm
  # provenance for the 6.x line; the "downgrade" is a publish-date false positive.
  - semver@6.3.1
packages:
  - docs
  - demo
  - playground
  - packages/*
# Security overrides for advisories in dev/CI/demo-only transitive deps (none
# ship in published @pikacss/* packages). Ranges use `>=` so the release-age
# policy above still picks the newest allowed patched version.
overrides:
  # changelogithub -> changelogen@0.5.7 -> c12@1 -> giget@1 is still tied to
  # tar@6, which has no patched release. Keep this scoped until upstream moves.
  giget@1>tar: '>=7.5.21 <8'
  # monaco-editor pins DOMPurify exactly below the patched floor. Keep this
  # scoped until Monaco updates its dependency.
  monaco-editor>dompurify: '>=3.4.13 <4'

catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@babel/parser': ^8.0.4
  '@babel/traverse': ^8.0.4
  '@babel/types': ^8.0.4
  '@clack/prompts': ^1.7.0
  '@deviltea/eslint-config': ^9.0.0
  '@deviltea/tsconfig': ^1.0.0
  '@iconify-json/line-md': ^1.2.16
  '@iconify-json/vscode-icons': ^1.2.76
  '@iconify/utils': ^3.1.4
  '@mdn/browser-compat-data': ^8.1.0
  '@nuxt/kit': ^4.5.2
  '@nuxt/schema': ^4.5.2
  '@shikijs/core': ^4.4.3
  '@shikijs/engine-javascript': ^4.4.3
  '@shikijs/langs': ^4.4.3
  '@shikijs/monaco': ^4.4.3
  '@shikijs/themes': ^4.4.3
  '@shikijs/vitepress-twoslash': ^4.4.3
  '@types/babel__traverse': ^7.28.0
  '@types/node': ^24.13.2
