blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@webref/css'
  - '@mdn/browser-compat-data'
  - '@mdn/data'
  - web-features
  - '@deviltea/eslint-config'
  - '@deviltea/tsconfig'

shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # semver@6.3.1 (latest 6.x, required by @babel/core via `^6.3.1`) predates npm
  # provenance for the 6.x line; the "downgrade" is a publish-date false positive.
  - semver@6.3.1
packages:
  - docs
  - demo
  - playground
  - packages/*
# Security overrides for advisories in dev/CI/demo-only transitive deps (none
# ship in published @pikacss/* packages). Ranges use `>=` so the release-age
# policy above still picks the newest allowed patched version.
overrides:
  # @hono/node-server <2.0.5 (via repomix>@modelcontextprotocol/sdk): serveStatic
  # path traversal.
  '@hono/node-server': '>=2.0.5'
  # brace-expansion <5.0.9 (via eslint tooling): unbounded expansion DoS.
  brace-expansion: '>=5.0.9 <6'
  # dompurify <3.4.13 (via docs mermaid): IN_PLACE hook-removal XSS.
  dompurify: '>=3.4.13 <4'

  # fast-uri <3.1.5 (via repomix>@modelcontextprotocol/sdk>ajv): host confusion.
  # Stay in the 3.x line ajv expects.
  fast-uri: '>=3.1.5 <4'
  # hono <4.12.34 (via repomix>@modelcontextprotocol/sdk): request-processing
  # DoS and cross-request SSR disclosure.
  hono: '>=4.12.34 <5'
  # ip-address <10.3.1 (via repomix>@modelcontextprotocol/sdk>express-rate-limit):
  # SSRF/trust-boundary classification bypasses.
  ip-address: '>=10.3.1 <11'
  # js-yaml 3.x <3.15.1 (via gray-matter): quadratic !!omap parsing DoS.
  # gray-matter still depends on the 3.x line, so keep this major-compatible.
  js-yaml: '>=3.15.1 <4'
  # postcss <8.5.23 (via Vite): source-map path traversal/file disclosure.
  postcss: '>=8.5.23 <9'
  # tar <7.5.21 (via changelogithub>changelogen>c12>giget): archive-processing
  # path traversal and DoS advisories.
  tar: '>=7.5.21 <8'
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@babel/parser': ^7.29.7
  '@babel/traverse': ^7.29.7
  '@babel/types': ^7.29.7
  '@clack/prompts': ^1.6.0
  '@deviltea/eslint-config': ^9.0.0
  '@deviltea/tsconfig': ^1.0.0
  '@iconify-json/line-md': ^1.2.16
  '@iconify-json/vscode-icons': ^1.2.37
  '@iconify/utils': ^3.1.3
  '@mdn/browser-compat-data': ^8.0.5
  '@nuxt/kit': ^4.4.8
  '@nuxt/schema': ^4.4.8
  '@shikijs/core': ^4.3.1
  '@shikijs/engine-javascript': ^4.3.1
  '@shikijs/langs': ^4.3.1
  '@shikijs/monaco': ^4.3.1
  '@shikijs/themes': ^4.3.1
  '@shikijs/vitepress-twoslash': ^3.23.0
  '@types/babel__traverse': ^7.28.0
